<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Callsheet — the sequence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4efe6; --ink:#1c1915; --muted:#5b544a; --soft:#8a8174;
    --rule:#d8cfbf; --accent:#1f4e5f; --accent-tint:rgba(31,78,95,0.08);
    --sans:'Geist','DejaVu Sans',system-ui,sans-serif;
    --mono:'Geist Mono','DejaVu Sans Mono',monospace;
    --serif:'Instrument Serif',Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  .page{max-width:1400px;margin:0 auto;padding:72px 48px 56px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
  h1{font-family:var(--serif);font-weight:400;font-size:56px;line-height:1.04;letter-spacing:-.02em;margin:0;max-width:900px}
  .sub{margin:16px 0 0;max-width:760px;color:var(--muted);font-size:16px;line-height:1.55}
  .diagram-container{width:100%;overflow-x:auto;margin-top:40px}
  svg{width:100%;min-width:1280px;display:block}
  .foot{margin-top:18px;display:flex;justify-content:space-between;gap:24px;font-family:var(--mono);font-size:11px;color:var(--soft)}
  @media print{.diagram-container{overflow-x:visible}svg{min-width:0}}
</style>
</head>
<body>
<main class="page">
  <div class="eyebrow">Callsheet · the sequence</div>
  <h1>Read here. Write there. Check here.</h1>
  <p class="sub">One document, one sealed packet, one call sheet. Time flows down. The bill never leaves the browser column.</p>

  <div class="diagram-container">
  <svg viewBox="0 0 1280 720" role="img" aria-labelledby="seq-title seq-desc">
    <title id="seq-title">Callsheet sequence</title>
    <desc id="seq-desc">The user opens a bill in the browser; the browser reads it on device, checks and seals it; the packet goes to the cloud; the questions return; the browser fences them, fills in the phone, and hands the call sheet back to the user.</desc>
    <defs>
      <marker id="s-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b544a"/>
      </marker>
      <marker id="s-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e5f"/>
      </marker>
    </defs>

    <!-- actors -->
    <g>
      <rect x="120" y="24" width="160" height="48" rx="6" style="fill:#ffffff;stroke:var(--ink)" stroke-width="1"/>
      <text x="200" y="53" text-anchor="middle" font-family="var(--sans)" font-size="14" font-weight="600" style="fill:var(--ink)">You</text>
    </g>
    <g>
      <rect x="560" y="24" width="200" height="48" rx="6" style="fill:#ffffff;stroke:var(--ink)" stroke-width="1"/>
      <text x="660" y="45" text-anchor="middle" font-family="var(--sans)" font-size="14" font-weight="600" style="fill:var(--ink)">Browser</text>
      <text x="660" y="61" text-anchor="middle" font-family="var(--mono)" font-size="7.5" style="fill:var(--muted)">Gemini Nano · Rust/WASM</text>
    </g>
    <g>
      <rect x="1020" y="24" width="200" height="48" rx="6" style="fill:rgba(31,78,95,0.04);stroke:var(--accent)" stroke-width="1"/>
      <text x="1120" y="45" text-anchor="middle" font-family="var(--sans)" font-size="14" font-weight="600" style="fill:var(--accent)">Cloud</text>
      <text x="1120" y="61" text-anchor="middle" font-family="var(--mono)" font-size="7.5" style="fill:var(--accent)">Gemini Flash-Lite</text>
    </g>

    <!-- lifelines -->
    <line x1="200" y1="72" x2="200" y2="640" style="stroke:rgba(28,25,21,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="660" y1="72" x2="660" y2="640" style="stroke:rgba(28,25,21,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="1120" y1="72" x2="1120" y2="640" style="stroke:rgba(31,78,95,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- activation -->
    <rect x="656" y="150" width="8" height="458" style="fill:rgba(28,25,21,0.06);stroke:var(--muted)" stroke-width="0.8"/>

    <!-- arrows -->
    <line x1="200" y1="150" x2="656" y2="150" style="stroke:var(--muted)" stroke-width="1.2" marker-end="url(#s-ar)"/>
    <path d="M 660 220 H 760 V 248 H 660" fill="none" style="stroke:var(--muted)" stroke-width="1.2" marker-end="url(#s-ar)"/>
    <path d="M 660 300 H 760 V 328 H 660" fill="none" style="stroke:var(--muted)" stroke-width="1.2" marker-end="url(#s-ar)"/>
    <line x1="664" y1="390" x2="1020" y2="390" style="stroke:var(--accent)" stroke-width="1.6" marker-end="url(#s-accent)"/>
    <line x1="1020" y1="460" x2="664" y2="460" style="stroke:var(--muted)" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#s-ar)"/>
    <path d="M 660 520 H 760 V 548 H 660" fill="none" style="stroke:var(--muted)" stroke-width="1.2" marker-end="url(#s-ar)"/>
    <line x1="656" y1="600" x2="200" y2="600" style="stroke:var(--accent)" stroke-width="1.4" marker-end="url(#s-accent)"/>

    <!-- labels -->
    <rect x="380" y="140" width="90" height="16" rx="2" style="fill:var(--paper)"/>
    <text x="425" y="151" text-anchor="middle" font-family="var(--mono)" font-size="8" letter-spacing="0.08em" style="fill:var(--muted)">OPEN A BILL</text>
    <text x="772" y="220" font-family="var(--mono)" font-size="8" letter-spacing="0.06em" style="fill:var(--muted)">READ ON DEVICE</text>
    <text x="772" y="300" font-family="var(--mono)" font-size="8" letter-spacing="0.06em" style="fill:var(--muted)">CHECK · SEAL</text>
    <rect x="850" y="380" width="100" height="16" rx="2" style="fill:var(--paper)"/>
    <text x="900" y="391" text-anchor="middle" font-family="var(--mono)" font-size="8" letter-spacing="0.08em" style="fill:var(--accent)">SEALED PACKET</text>
    <rect x="850" y="450" width="80" height="16" rx="2" style="fill:var(--paper)"/>
    <text x="890" y="461" text-anchor="middle" font-family="var(--mono)" font-size="8" letter-spacing="0.08em" style="fill:var(--muted)">QUESTIONS</text>
    <text x="772" y="520" font-family="var(--mono)" font-size="8" letter-spacing="0.06em" style="fill:var(--muted)">FENCE · FILL IN</text>
    <rect x="380" y="590" width="80" height="16" rx="2" style="fill:var(--paper)"/>
    <text x="420" y="601" text-anchor="middle" font-family="var(--mono)" font-size="8" letter-spacing="0.08em" style="fill:var(--accent)">CALL SHEET</text>

    <!-- note -->
    <text x="120" y="190" font-family="var(--sans)" font-size="11" style="fill:var(--soft)">The bill never leaves</text>
    <text x="120" y="206" font-family="var(--sans)" font-size="11" style="fill:var(--soft)">the browser.</text>

    <!-- legend -->
    <line x1="120" y1="680" x2="152" y2="680" style="stroke:var(--muted)" stroke-width="1.2"/>
    <text x="160" y="683" font-family="var(--mono)" font-size="8" letter-spacing="0.1em" style="fill:var(--soft)">REQUEST</text>
    <line x1="250" y1="680" x2="282" y2="680" style="stroke:var(--muted)" stroke-width="1.1" stroke-dasharray="4,3"/>
    <text x="290" y="683" font-family="var(--mono)" font-size="8" letter-spacing="0.1em" style="fill:var(--soft)">RETURN</text>
    <line x1="370" y1="680" x2="402" y2="680" style="stroke:var(--accent)" stroke-width="1.6"/>
    <text x="410" y="683" font-family="var(--mono)" font-size="8" letter-spacing="0.1em" style="fill:var(--soft)">THE CHECK</text>
  </svg>
  </div>

  <div class="foot">
    <span>One document. One packet. One sheet.</span>
    <span>No account · no chat · no negotiation</span>
  </div>
</main>
</body>
</html>
