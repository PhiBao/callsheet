<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" role="img" aria-labelledby="title desc">
  <title id="title">Read, seal, write, verify</title>
  <desc id="desc">The Callsheet sequence. The bill stays on the device, a sealed packet crosses to the cloud, the draft comes back, and the Rust fence checks it before the call sheet is filled in locally.</desc>
  <defs>
    <marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c1915" />
    </marker>
    <marker id="kept" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e5f" />
    </marker>
  </defs>

  <rect width="1200" height="920" fill="#f4efe6" />

  <text x="56" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#1c1915">Read, seal, write, verify</text>
  <text x="56" y="90" font-family="system-ui, sans-serif" font-size="14" fill="#5b544a">Callsheet · the sequence a judge can watch · #BuildHybridAI 2026</text>

  <text x="72" y="136" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#8a8174">THIS COMPUTER</text>
  <text x="840" y="136" font-family="system-ui, sans-serif" font-size="11" letter-spacing="2" fill="#1f4e5f">CLOUD</text>

  <line x1="720" y1="118" x2="720" y2="876" stroke="#1f4e5f" stroke-width="2" stroke-dasharray="7 7" />
  <text x="734" y="112" font-family="system-ui, sans-serif" font-size="10" letter-spacing="2" fill="#1f4e5f">THE BOUNDARY</text>

  <!-- 1 -->
  <circle cx="60" cy="176" r="12" fill="#1c1915" />
  <text x="60" y="181" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#f4efe6">1</text>
  <rect x="92" y="152" width="500" height="50" fill="#ffffff" stroke="#b9ae9c" />
  <text x="108" y="174" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1915">The bill or EOB</text>
  <text x="108" y="192" font-family="system-ui, sans-serif" font-size="11" fill="#5b544a">name, member ID, phone, lines · stays here</text>

  <!-- 2 -->
  <circle cx="60" cy="252" r="12" fill="#1c1915" />
  <text x="60" y="257" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#f4efe6">2</text>
  <rect x="92" y="228" width="500" height="50" fill="#e6eef0" stroke="#1f4e5f" />
  <text x="108" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f4e5f">Gemini Nano · Firebase AI Logic</text>
  <text x="108" y="268" font-family="system-ui, sans-serif" font-size="11" fill="#5b544a">ONLY_ON_DEVICE · structured JSON · no fallback</text>

  <!-- 3 -->
  <circle cx="60" cy="328" r="12" fill="#1c1915" />
  <text x="60" y="333" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#f4efe6">3</text>
  <rect x="92" y="304" width="500" height="50" fill="#ffffff" stroke="#1c1915" />
  <text x="108" y="326" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1915">Rust / WebAssembly checks</text>
  <text x="108" y="344" font-family="system-ui, sans-serif" font-size="11" fill="#5b544a">duplicate 99213 · $146.00 vs $110.00 · cannot be edited by the model</text>

  <!-- 4 -->
  <circle cx="60" cy="404" r="12" fill="#1c1915" />
  <text x="60" y="409" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#f4efe6">4</text>
  <rect x="92" y="380" width="500" height="50" fill="#e6eef0" stroke="#1f4e5f" />
  <text x="108" y="402" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f4e5f">Seal</text>
  <text x="108" y="420" font-family="system-ui, sans-serif" font-size="11" fill="#5b544a">a new struct with only codes, dates, amounts, checks, gloss ids</text>

  <!-- 5 -->
  <circle cx="60" cy="488" r="12" fill="#1c1915" />
  <text x="60" y="493" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#f4efe6">5</text>
  <rect x="92" y="464" width="500" height="50" fill="#ffffff" stroke="#1c1915" />
  <text x="108" y="486" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1915">You review the packet</text>
  <text x="108" y="504" font-family="system-ui, sans-serif" font-size="11" fill="#5b544a">the exact bytes before anything is sent</text>

  <line x1="592" y1="489" x2="820" y2="489" stroke="#1f4e5f" stroke-width="2.5" marker-end="url(#kept)" />
  <text x="604" y="480" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1f4e5f">only the packet</text>

  <rect x="836" y="464" width="300" height="50" fill="#ffffff" stroke="#1f4e5f" />
  <text x="852" y="486" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f4e5f">Sealed packet</text>
  <text x="852" y="504" font-family="system-ui, sans-serif" font-size="11" fill="#5b544a">codes, dates, amounts, checks</text>

  <!-- 6 -->
  <circle cx="60" cy="568" r="12" fill="#1c1915" />
  <text x="60" y="573" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#f4efe6">6</text>
  <text x="92" y="566" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1915">The cloud writes</text>
  <text x="92" y="584" font-family="system-ui, sans-serif" font-size="11" fill="#5b544a">the packet is the only input</text>
  <rect x="836" y="544" width="300" height="50" fill="#e6eef0" stroke="#1f4e5f" />
  <text x="852" y="566" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1f4e5f">Gemini Flash-Lite · Firebase AI Logic</text>
  <text x="852" y="584" font-family="system-ui, sans-serif" font-size="11" fill="#5b544a">ONLY_IN_CLOUD · writes the questions</text>

  <!-- 7 -->
  <circle cx="60" cy="648" r="12" fill="#1c1915" />
  <text x="60" y="653" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#f4efe6">7</text>
  <polyline points="836,594 836,649 592,649" fill="none" stroke="#1f4e5f" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#kept)" />
  <text x="604" y="640" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#1f4e5f">draft</text>

  <rect x="92" y="624" width="500" height="50" fill="#ffffff" stroke="#1c1915" />
  <text x="108" y="646" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1915">Rust / WebAssembly citation fence</text>
  <text x="108" y="664" font-family="system-ui, sans-serif" font-size="11" fill="#5b544a">drop a $999.00 fee · drop a patient name · show the reason</text>

  <!-- 8 -->
  <circle cx="60" cy="728" r="12" fill="#1c1915" />
  <text x="60" y="733" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#f4efe6">8</text>
  <rect x="92" y="704" width="500" height="50" fill="#ffffff" stroke="#1c1915" />
  <text x="108" y="726" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#1c1915">Fill in the private values</text>
  <text x="108" y="744" font-family="system-ui, sans-serif" font-size="11" fill="#5b544a">the billing phone number, restored from the page</text>

  <!-- 9 -->
  <circle cx="60" cy="808" r="12" fill="#1c1915" />
  <text x="60" y="813" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" fill="#f4efe6">9</text>
  <rect x="92" y="784" width="1044" height="50" fill="#ffffff" stroke="#1c1915" />
  <text x="108" y="806" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#1c1915">The call sheet</text>
  <text x="108" y="824" font-family="system-ui, sans-serif" font-size="11" fill="#5b544a">questions · billing phone · disclaimer · packet hash · on_device / in_cloud</text>

  <text x="56" y="890" font-family="system-ui, sans-serif" font-size="12" fill="#5b544a">The model writes the prose. The Rust verdict is the part it cannot change.</text>
</svg>
