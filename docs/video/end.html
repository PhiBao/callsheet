<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --paper: #f4efe6;
        --ink: #1c1915;
        --soft: #5b544a;
        --faint: #8a8174;
        --kept: #1f4e5f;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .card {
        width: 100%;
        height: 100%;
        padding: 92px 112px 76px;
        display: flex;
        flex-direction: column;
      }
      .kicker {
        font-size: 21px;
        letter-spacing: 0.18em;
        color: var(--soft);
      }
      .rule {
        height: 1px;
        background: var(--ink);
        margin-top: 24px;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 400;
        font-size: 92px;
        line-height: 1.02;
        letter-spacing: -0.025em;
        margin: 110px 0 0;
      }
      .sub {
        margin-top: 46px;
        font-size: 37px;
        line-height: 1.5;
        color: var(--soft);
      }
      .links {
        margin-top: 34px;
        font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
        font-size: 30px;
        line-height: 1.6;
        color: var(--kept);
      }
      .foot {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        font-size: 20px;
        color: var(--faint);
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="kicker">CALLSHEET</div>
      <div class="rule"></div>
      <h1>A bill, turned into<br />the call you should make.</h1>
      <p class="sub">
        A private on-device read. A sealed packet. A check the model cannot change.
      </p>
      <div class="links">
        github.com/PhiBao/callsheet<br />
        callsheet-hybrid.web.app
      </div>
      <div class="foot">
        <span>Apache-2.0</span>
        <span>Synthetic demo · not medical advice</span>
      </div>
    </div>
  </body>
</html>
